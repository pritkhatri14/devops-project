<!DOCTYPE html>
<html>
<head>
    <title>Production Environment</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07140c;
            color: #ffffff;
            text-align: center;
        }

        .header {
            padding: 35px;
            border-bottom: 1px solid #176b38;
        }

        h1 {
            color: #42e878;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 20px;
            background: #0d4d29;
            color: #6cff9b;
            margin: 20px;
        }

        .card {
            margin: 30px auto;
            padding: 30px;
            max-width: 700px;
            background: #0d2115;
            border: 1px solid #176b38;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PRODUCTION ENVIRONMENT</h1>
        <div class="status">● SYSTEM ONLINE</div>
        <p>Live Production Environment</p>
    </div>

    <div class="card">
        <h2>CI/CD Pipeline</h2>
        <p>Environment: PRODUCTION</p>
        <p>Port: 8083</p>
        <p>Docker Container: my-website-production</p>
        <p>Health Check: PASSED</p>
    </div>

</body>
</html>
